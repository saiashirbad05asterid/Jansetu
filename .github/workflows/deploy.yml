name: Deploy JanSetu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: playground-0505
  REGION: asia-south1
  SERVICE: jansetu-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Firebase environment
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: printf '%s' "$FIREBASE_ENV" > .env.local

      - name: Build frontend
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Deploy Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          source: cloudrun
          flags: --allow-unauthenticated
          env_vars: FIREBASE_PROJECT_ID=${{ env.PROJECT_ID }}

      - name: Deploy Firebase Hosting and rules
        run: npx firebase-tools@15.32.0 deploy --project "$PROJECT_ID" --only hosting,firestore:rules,storage --non-interactive
